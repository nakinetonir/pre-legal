[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Pre-Legal backend: fake-login auth and static frontend serving (AG-62 technical base)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "litellm>=1.97.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
